# Local development database only. Credentials are fictional and local.
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: cleaning_security
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d cleaning_security"]
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  postgres-data:
