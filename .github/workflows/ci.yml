name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      # Temporary bootstrap: generate a lockfile until the repository commits one.
      - run: npm install --package-lock-only --ignore-scripts
      - name: Export temporary lockfile for repository bootstrap
        run: |
          printf 'LOCKFILE_START\n'
          cat package-lock.json
          printf '\nLOCKFILE_END\n'
      - uses: actions/upload-artifact@v4
        with:
          name: dependency-lockfile
          path: package-lock.json
          if-no-files-found: error
          retention-days: 7
      - run: npm ci
      - run: npm audit --audit-level=high
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - run: npm run build
