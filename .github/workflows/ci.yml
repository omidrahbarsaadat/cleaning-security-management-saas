name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install
      - name: Summarize dependency audit
        run: |
          npm audit --json > audit-report.json || true
          node -e "const audit = require('./audit-report.json'); for (const [name, item] of Object.entries(audit.vulnerabilities || {})) console.log(name + ': ' + item.severity + '; direct=' + item.isDirect + '; fix=' + JSON.stringify(item.fixAvailable))"
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
